<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 6 Navbar</title>
    <!-- Bootstrap 6.0.0-alpha1 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: 600;
        }

        .nav-link.active {
            font-weight: 600;
            color: var(--bs-primary) !important;
        }
    </style>
</head>

<body>

    <!-- Bootstrap 6 Navbar with Drawer for mobile -->
    <nav class="navbar" style="--bs-navbar-bg: #fff; --bs-navbar-color: #333;">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand" href="#">MySite</a>

            <!-- Toggler opens a native dialog drawer -->
            <button class="navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#mainDrawer"
                aria-controls="mainDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Desktop nav links (visible on lg+) -->
            <ul class="navbar-nav ms-auto d-none lg:d-flex">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Mobile Drawer (native dialog) -->
    <dialog class="drawer" id="mainDrawer">
        <div class="drawer-header">
            <h5 class="drawer-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
            <ul class="navbar-nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>
        </div>
    </dialog>

    <main class="container py-5">
        <h1>Bootstrap 6 Navbar</h1>
        <p>Resize the browser to see the drawer pattern on mobile.</p>
    </main>

    <!-- Bootstrap 6 JS (ESM only) -->
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha1/dist/js/bootstrap.esm.min.js"></script>
</body>

</html>
